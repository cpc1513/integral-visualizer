<!doctype html>
<html lang="zh-CN" class="dark">
  <head>
    <meta charset="UTF-8" />
    <script>
      // 首帧前恢复主题，避免明暗闪烁（与 App.tsx 的 ivp-theme 对应）
      try {
        var t = localStorage.getItem('ivp-theme') || 'dark'
        document.documentElement.classList.toggle('dark', t !== 'light')
      } catch (e) { /* 保持默认 dark */ }
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>积分视界 · 高等数学（下册）</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
